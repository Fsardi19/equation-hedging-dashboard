<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Equation Coffee — Libro de Coberturas (MVP v2)</title>
<style>
  :root { --amber:#b45309; --amber-d:#92400e; --bg:#f9fafb; --line:#e5e7eb; --muted:#6b7280; --open:#fed7aa; --open-b:#fb923c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:#111827; }
  nav { display:flex; align-items:center; gap:16px; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; box-shadow:0 1px 2px rgba(0,0,0,.04); flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; font-size:14px; cursor:pointer; }
  nav a:hover { color:#000; } nav a.active { color:var(--amber-d); font-weight:600; }
  nav .brand { font-weight:600; color:var(--amber-d); }
  nav .tag { margin-left:auto; background:#fef3c7; color:var(--amber-d); font-size:12px; padding:2px 8px; border-radius:6px; }
  main { max-width:1180px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; font-weight:600; } h2 { font-size:15px; font-weight:600; margin:0 0 8px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .spacer { margin-left:auto; }
  button, .btn { cursor:pointer; border:none; border-radius:6px; padding:8px 14px; font-size:14px; }
  .btn-primary { background:var(--amber); color:#fff; } .btn-primary:hover { background:var(--amber-d); }
  .btn-dark { background:#1f2937; color:#fff; padding:6px 12px; } .btn-dark:hover { background:#000; }
  .btn-ghost { background:#fff; border:1px solid var(--line); color:#111827; } .btn-ghost:hover { background:#f3f4f6; }
  .btn-danger { background:#fff; border:1px solid #fecaca; color:#dc2626; } .btn-danger:hover { background:#fef2f2; }
  input, select, textarea { border:1px solid var(--line); border-radius:6px; padding:8px; font-size:14px; font-family:inherit; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
  thead tr.grp th { background:#f3f4f6; text-align:center; font-size:11px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); }
  thead tr.col th { background:#f9fafb; text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); }
  th, td { padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .num { text-align:right; }
  .open { background:var(--open); }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .legboxes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .muted { color:var(--muted); font-size:12px; }
  .big { font-size:22px; font-weight:700; }
  .pos { font-size:20px; font-weight:700; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .pill.cerrada { background:#dcfce7; color:#15803d; } .pill.abierta { background:var(--open); color:#9a3412; }
  .link { color:#2563eb; text-decoration:underline; cursor:pointer; }
  .empty { border:1px dashed var(--line); border-radius:8px; padding:32px; text-align:center; color:var(--muted); font-size:14px; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  label.field { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  section { margin-top:22px; }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--muted); align-items:center; flex-wrap:wrap; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle; margin-right:4px; }
  .pos-usd { color:#15803d; font-weight:600; } .neg-usd { color:#b91c1c; font-weight:600; }
  fieldset { border:1px solid var(--line); border-radius:8px; padding:12px; }
  legend { font-size:12px; font-weight:600; color:#374151; padding:0 6px; }
  @media (max-width:720px){ .grid2,.legboxes{grid-template-columns:1fr;} }
</style>
</head>
<body>
<nav>
  <span class="brand">☕ Equation — Coberturas</span>
  <a data-v="libro" onclick="go('/libro')">Libro de coberturas</a>
  <a data-v="nueva" onclick="go('/nueva')">Nueva cobertura</a>
  <a data-v="fx" onclick="go('/fx')">Coberturas FX</a>
  <span class="tag">MVP v2 — datos en tu navegador</span>
</nav>
<main id="app"></main>

<script>
/* ============ CONSTANTES / DOMINIO ============ */
const LB_PER_KG = 2.2046226218;
const KC_CONTRACT_LB = 37500;   // 1 lote KC
const KG_SACO_COB = 60;         // sacos de coberturas
const MESES = ['Marzo','Mayo','Julio','Septiembre','Diciembre'];
const NEMO = { Marzo:'H', Mayo:'K', Julio:'N', Septiembre:'U', Diciembre:'Z' };

const sacos60ToLb = (s) => s * KG_SACO_COB * LB_PER_KG;
const lbToLotes = (lb) => lb / KC_CONTRACT_LB;
const sacos60ToLotes = (s) => lbToLotes(sacos60ToLb(s));

// Una pata "existe" si tiene precio.
const legOk = (leg) => leg && leg.precio !== null && leg.precio !== undefined && leg.precio !== '';
function coberturaEstado(c) { return (legOk(c.compra) && legOk(c.venta)) ? 'CERRADA' : 'ABIERTA'; }
function lotesDe(c) {
  const lc = legOk(c.compra) ? sacos60ToLotes(c.compra.sacos60) : null;
  const lv = legOk(c.venta) ? sacos60ToLotes(c.venta.sacos60) : null;
  if (lc !== null && lv !== null) return Math.min(lc, lv);
  return lc ?? lv ?? 0;
}
// Resultado (USD) = (precio venta - precio compra) * lotes * 37.500
function resultadoDe(c) {
  if (coberturaEstado(c) !== 'CERRADA') return null;
  const lotes = lotesDe(c);
  return (c.venta.precio - c.compra.precio) * lotes * KC_CONTRACT_LB;
}

/* ============ STORE (localStorage) ============ */
const KEY = 'eq_cob_v2';
const EMPTY = { coberturas: [], fx: [] };
function seed() {
  const cob = (o) => Object.assign({ id: uid(), incoterm:'FOB', producto:'', cliente:'', pedido:'', posicion:'Septiembre', fnd:'', compra:null, venta:null }, o);
  const leg = (codigoHP, fecha, sacos60, precio) => ({ codigoHP, fecha, sacos60, precio });
  return {
    coberturas: [
      cob({ cliente:'Katz (Serengueti)', pedido:'S00443', posicion:'Septiembre', fnd:'2026-08-20',
            compra: leg('1506855','2026-07-22',70,3.1810), venta: leg('1504300','2026-07-21',70,3.2790) }),
      cob({ cliente:'TAF', pedido:'S00329', posicion:'Septiembre', fnd:'2026-08-20',
            compra: leg('1519396','2026-07-29',140,3.2975), venta: leg('1516379','2026-07-28',140,3.4590) }),
      cob({ cliente:'SPOT USA', pedido:'', posicion:'Diciembre', fnd:'2026-11-20',
            compra: leg('1509836','2026-07-23',70,2.9610), venta: leg('1534536','2026-08-07',70,3.1890) }),
      cob({ cliente:'Royal Coffee Inc', pedido:'S00454', posicion:'Diciembre', fnd:'2026-11-20',
            compra: leg('1524797','2026-08-03',175,3.1010), venta: null }),   // ABIERTA (falta vender el contrato)
    ],
    fx: [
      { id: uid(), par:'USDCOP', tipo:'FORWARD', lado:'VENTA', nocional:200000, tasa:4050, fecha:'2026-07-02', vencimiento:'2026-09-15', pedido:'S00443', notas:'Cobertura ingreso USD venta Katz' },
    ],
  };
}
function loadDb() {
  const raw = localStorage.getItem(KEY);
  if (!raw) { const s = seed(); localStorage.setItem(KEY, JSON.stringify(s)); return s; }
  try { return { ...structuredClone(EMPTY), ...JSON.parse(raw) }; } catch { return structuredClone(EMPTY); }
}
function saveDb(db) { localStorage.setItem(KEY, JSON.stringify(db)); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));

/* ============ HELPERS ============ */
const money = (n) => Number(n).toLocaleString('es-CO', { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmt = (n) => Number(n).toLocaleString('es-CO', { maximumFractionDigits: 0 });
const lot = (n) => Number(n).toLocaleString('es-CO', { minimumFractionDigits:4, maximumFractionDigits:4 });
const px  = (n) => (n===null||n===undefined||n==='') ? '' : Number(n).toLocaleString('es-CO',{minimumFractionDigits:4,maximumFractionDigits:4});
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));
const go = (p) => { location.hash = '#' + p; };
const val = (f,n) => { const el=f.elements[n]; return el ? el.value : ''; };
const numOrNull = (v) => (v===''||v===null||v===undefined) ? null : Number(v);
const strOrNull = (v) => (v===''||v===null||v===undefined) ? null : v;
function nemo(pos){ return NEMO[pos] ? `KC${NEMO[pos]}` : ''; }

/* ============ ROUTER ============ */
function render() {
  const app = document.getElementById('app');
  const hash = location.hash.replace(/^#/, '') || '/libro';
  const [_, view, id] = hash.split('/');
  document.querySelectorAll('nav a[data-v]').forEach(a => a.classList.toggle('active', a.dataset.v === (view||'libro')));
  if (view === 'nueva') return renderForm(app, null);
  if (view === 'editar' && id) return renderForm(app, id);
  if (view === 'cobertura' && id) return renderDetalle(app, id);
  if (view === 'fx') return renderFx(app);
  return renderLibro(app);
}

/* ============ LIBRO DE COBERTURAS ============ */
function renderLibro(app) {
  const db = loadDb();
  const fCli = window.__fCli || 'TODOS';
  const fPos = window.__fPos || 'TODOS';
  const fEst = window.__fEst || 'TODOS';
  const clientes = [...new Set(db.coberturas.map(c => c.cliente).filter(Boolean))].sort();

  let rows = db.coberturas.slice();
  const filtered = rows.filter(c =>
    (fCli==='TODOS'||c.cliente===fCli) &&
    (fPos==='TODOS'||c.posicion===fPos) &&
    (fEst==='TODOS'||coberturaEstado(c)===fEst));

  const totalRes = filtered.filter(c=>coberturaEstado(c)==='CERRADA').reduce((a,c)=>a+resultadoDe(c),0);
  const abiertas = filtered.filter(c=>coberturaEstado(c)==='ABIERTA').length;

  const body = db.coberturas.length===0
    ? `<div class="empty">No hay coberturas todavía. <span class="link" onclick="go('/nueva')">Crear la primera</span>.</div>`
    : `<div class="row" style="margin-bottom:8px">
        <select onchange="window.__fCli=this.value;render()">
          <option value="TODOS" ${fCli==='TODOS'?'selected':''}>Todos los clientes</option>
          ${clientes.map(c=>`<option ${c===fCli?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <select onchange="window.__fPos=this.value;render()">
          <option value="TODOS" ${fPos==='TODOS'?'selected':''}>Toda posición</option>
          ${MESES.map(m=>`<option ${m===fPos?'selected':''}>${m}</option>`).join('')}
        </select>
        <select onchange="window.__fEst=this.value;render()">
          ${[['TODOS','Todos los estados'],['ABIERTA','Solo abiertas'],['CERRADA','Solo cerradas']].map(([v,l])=>`<option value="${v}" ${v===fEst?'selected':''}>${l}</option>`).join('')}
        </select>
        <span class="muted">${filtered.length} de ${db.coberturas.length}</span>
      </div>
      <div class="tablewrap"><table>
        <thead>
          <tr class="grp"><th colspan="2"></th><th colspan="4" style="border-left:2px solid var(--line)">Compra (long futuro)</th><th colspan="4" style="border-left:2px solid var(--line)">Venta (short futuro)</th><th colspan="3" style="border-left:2px solid var(--line)"></th></tr>
          <tr class="col">
            <th>Cliente</th><th>Pedido</th>
            <th style="border-left:2px solid var(--line)">Cód. HP</th><th>Fecha</th><th class="num">Sacos60</th><th class="num">Precio</th>
            <th style="border-left:2px solid var(--line)">Cód. HP</th><th>Fecha</th><th class="num">Sacos60</th><th class="num">Precio</th>
            <th style="border-left:2px solid var(--line)">Posición</th><th>FND</th><th class="num">Resultado USD</th>
          </tr>
        </thead>
        <tbody>${filtered.map(c=>{
          const est = coberturaEstado(c);
          const res = resultadoDe(c);
          const cOpen = !legOk(c.compra), vOpen = !legOk(c.venta);
          const cls = est==='ABIERTA' ? 'open' : '';
          return `<tr style="cursor:pointer" onclick="go('/cobertura/${c.id}')">
            <td><b>${esc(c.cliente||'—')}</b></td><td>${esc(c.pedido||'')}</td>
            <td class="${cOpen?'open':''}" style="border-left:2px solid var(--line)">${esc(c.compra?.codigoHP||'')}</td>
            <td class="${cOpen?'open':''}">${c.compra?.fecha||''}</td>
            <td class="num ${cOpen?'open':''}">${c.compra?fmt(c.compra.sacos60):''}</td>
            <td class="num ${cOpen?'open':''}">${px(c.compra?.precio)}</td>
            <td class="${vOpen?'open':''}" style="border-left:2px solid var(--line)">${esc(c.venta?.codigoHP||'')}</td>
            <td class="${vOpen?'open':''}">${c.venta?.fecha||''}</td>
            <td class="num ${vOpen?'open':''}">${c.venta?fmt(c.venta.sacos60):''}</td>
            <td class="num ${vOpen?'open':''}">${px(c.venta?.precio)}</td>
            <td style="border-left:2px solid var(--line)">${esc(c.posicion)} <span class="muted">${nemo(c.posicion)}</span></td>
            <td>${c.fnd||''}</td>
            <td class="num">${res===null?`<span class="pill abierta">abierta</span>`:`<span class="${res>=0?'pos-usd':'neg-usd'}">${money(res)}</span>`}</td>
          </tr>`;}).join('')}</tbody>
        <tfoot><tr><td colspan="12" class="num"><b>Resultado neto (cerradas)</b></td><td class="num"><b class="${totalRes>=0?'pos-usd':'neg-usd'}">${money(totalRes)}</b></td></tr></tfoot>
      </table></div>
      <div class="legend" style="margin-top:10px">
        <span><span class="sw" style="background:var(--open)"></span><b>Abierta</b>: falta cruzar una pata (compra o venta sin cerrar)</span>
        <span><span class="sw" style="background:#dcfce7"></span><b>Cerrada</b>: compra y venta neteadas → Resultado calculado</span>
        <span>· ${abiertas} abierta(s) en el filtro</span>
      </div>`;

  app.innerHTML = `
    <div class="row">
      <h1>Libro de coberturas</h1>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="exportCsv()">⬇ Exportar CSV</button>
      <button class="btn-primary" onclick="go('/nueva')">+ Nueva cobertura</button>
    </div>
    <div style="margin-top:12px">${body}</div>`;
}

/* ============ FORM (nueva / editar) ============ */
function renderForm(app, id) {
  const db = loadDb();
  const c = id ? db.coberturas.find(x=>x.id===id) : null;
  const clientes = [...new Set(db.coberturas.map(x=>x.cliente).filter(Boolean))].sort();
  const g = (path, d='') => { // getter seguro
    if (!c) return d;
    const parts = path.split('.'); let v = c; for (const p of parts) v = v?.[p];
    return (v===null||v===undefined) ? d : v;
  };
  app.innerHTML = `
    <div class="row"><span class="link" onclick="go('/libro')">← Libro</span><h1>${id?'Editar':'Nueva'} cobertura</h1></div>
    <form id="cf" onsubmit="return submitCobertura(event, ${id?`'${id}'`:'null'})" style="margin-top:12px; max-width:820px">
      <fieldset><legend>Operación</legend>
        <div class="grid2">
          <label class="field">Cliente<input name="cliente" required list="cli" value="${esc(g('cliente'))}" placeholder="Katz (Serengueti)"></label>
          <datalist id="cli">${clientes.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
          <label class="field">Pedido<input name="pedido" value="${esc(g('pedido'))}" placeholder="S00443"></label>
          <label class="field">Producto (opcional)<input name="producto" value="${esc(g('producto'))}"></label>
          <label class="field">Incoterm<input name="incoterm" value="${esc(g('incoterm','FOB'))}"></label>
          <label class="field">Posición (mes del futuro)
            <select name="posicion">${MESES.map(m=>`<option ${m===g('posicion','Septiembre')?'selected':''}>${m}</option>`).join('')}</select>
          </label>
          <label class="field">FND (First Notice Day)<input name="fnd" type="date" value="${esc(g('fnd'))}"></label>
        </div>
      </fieldset>
      <div class="legboxes" style="margin-top:12px">
        <fieldset><legend>Compra (compramos el futuro — long)</legend>
          <label class="field">Código Hedge Point<input name="compra_codigoHP" value="${esc(g('compra.codigoHP'))}" placeholder="1506855"></label>
          <label class="field">Fecha<input name="compra_fecha" type="date" value="${esc(g('compra.fecha'))}"></label>
          <label class="field">Cantidad (sacos 60 kg)<input name="compra_sacos60" type="number" step="any" value="${esc(g('compra.sacos60'))}"></label>
          <label class="field">Precio (USD/lb)<input name="compra_precio" type="number" step="any" value="${esc(g('compra.precio'))}"></label>
          <div class="muted">Deja en blanco si esta pata aún no existe (quedará ABIERTA).</div>
        </fieldset>
        <fieldset><legend>Venta (vendemos el futuro — short)</legend>
          <label class="field">Código Hedge Point<input name="venta_codigoHP" value="${esc(g('venta.codigoHP'))}" placeholder="1504300"></label>
          <label class="field">Fecha<input name="venta_fecha" type="date" value="${esc(g('venta.fecha'))}"></label>
          <label class="field">Cantidad (sacos 60 kg)<input name="venta_sacos60" type="number" step="any" value="${esc(g('venta.sacos60'))}"></label>
          <label class="field">Precio (USD/lb)<input name="venta_precio" type="number" step="any" value="${esc(g('venta.precio'))}"></label>
          <div class="muted">Al completar ambas patas, el Resultado se calcula solo.</div>
        </fieldset>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn-primary">${id?'Guardar cambios':'Crear cobertura'}</button>
        ${id?`<button type="button" class="btn-danger" onclick="borrarCobertura('${id}')">Borrar cobertura</button>`:''}
      </div>
    </form>`;
}
function legFrom(f, pre) {
  const codigoHP = strOrNull(val(f, pre+'_codigoHP'));
  const fecha = strOrNull(val(f, pre+'_fecha'));
  const sacos60 = numOrNull(val(f, pre+'_sacos60'));
  const precio = numOrNull(val(f, pre+'_precio'));
  if (codigoHP===null && fecha===null && sacos60===null && precio===null) return null;
  return { codigoHP, fecha, sacos60, precio };
}
function submitCobertura(e, id) {
  e.preventDefault(); const f = e.target; const db = loadDb();
  const data = {
    cliente: val(f,'cliente'), pedido: strOrNull(val(f,'pedido')), producto: strOrNull(val(f,'producto')),
    incoterm: val(f,'incoterm')||'FOB', posicion: val(f,'posicion'), fnd: strOrNull(val(f,'fnd')),
    compra: legFrom(f,'compra'), venta: legFrom(f,'venta'),
  };
  if (id) { const i = db.coberturas.findIndex(x=>x.id===id); db.coberturas[i] = { ...db.coberturas[i], ...data }; }
  else { db.coberturas.push({ id: uid(), ...data }); }
  saveDb(db); go('/libro'); return false;
}
function borrarCobertura(id) {
  if (!confirm('¿Borrar esta cobertura?')) return;
  const db = loadDb(); db.coberturas = db.coberturas.filter(x=>x.id!==id); saveDb(db); go('/libro');
}

/* ============ DETALLE ============ */
function renderDetalle(app, id) {
  const db = loadDb(); const c = db.coberturas.find(x=>x.id===id);
  if (!c) { app.innerHTML = `<div class="empty">No encontrada. <span class="link" onclick="go('/libro')">Volver</span></div>`; return; }
  const est = coberturaEstado(c); const res = resultadoDe(c); const lotes = lotesDe(c);
  const legCard = (title, leg, sub) => {
    const open = !legOk(leg);
    return `<fieldset ${open?'style="background:var(--open)"':''}><legend>${title} ${open?'· <span style="color:#9a3412">ABIERTA</span>':''}</legend>
      <div class="muted">${sub}</div>
      ${leg ? `<div style="margin-top:6px">
        <div>Código HP: <b>${esc(leg.codigoHP||'—')}</b></div>
        <div>Fecha: ${leg.fecha||'—'}</div>
        <div>Cantidad: ${leg.sacos60?fmt(leg.sacos60)+' sacos 60kg':'—'} ${leg.sacos60?`(${lot(sacos60ToLotes(leg.sacos60))} lotes)`:''}</div>
        <div>Precio: ${leg.precio!=null?px(leg.precio)+' USD/lb':'—'}</div>
      </div>` : `<div style="margin-top:6px" class="muted">Sin datos — falta cruzar esta pata.</div>`}
    </fieldset>`;
  };
  app.innerHTML = `
    <div class="row"><span class="link" onclick="go('/libro')">← Libro</span>
      <h1>${esc(c.cliente||'—')} ${c.pedido?'· '+esc(c.pedido):''}</h1>
      <span class="pill ${est==='CERRADA'?'cerrada':'abierta'}">${est}</span></div>
    <div class="grid2" style="margin-top:12px">
      <div class="card">
        <div class="muted">POSICIÓN</div>
        <div class="pos">${esc(c.posicion)} <span class="muted" style="font-size:14px">${nemo(c.posicion)}</span></div>
        <div class="muted" style="margin-top:6px">FND: ${c.fnd||'—'} · Incoterm: ${esc(c.incoterm||'')} ${c.producto?'· '+esc(c.producto):''}</div>
      </div>
      <div class="card">
        <div class="muted">RESULTADO DE LA COBERTURA (USD)</div>
        <div class="big ${res===null?'':(res>=0?'pos-usd':'neg-usd')}">${res===null?'—':money(res)}</div>
        <div class="muted" style="margin-top:4px">${res===null?'Se calcula al cerrar ambas patas.':`(venta ${px(c.venta.precio)} − compra ${px(c.compra.precio)}) × ${lot(lotes)} lotes × 37.500 lb`}</div>
      </div>
    </div>
    <div class="legboxes" style="margin-top:12px">
      ${legCard('Compra (long futuro)', c.compra, 'Cuando vendemos al cliente, compramos el futuro.')}
      ${legCard('Venta (short futuro)', c.venta, 'Cuando compramos el café, vendemos el futuro y cerramos.')}
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn-dark" onclick="go('/editar/${c.id}')">✎ Editar / completar pata</button>
      <button class="btn-danger" onclick="borrarCobertura('${c.id}')">🗑 Borrar</button>
    </div>`;
}

/* ============ FX ============ */
function renderFx(app) {
  const db = loadDb();
  app.innerHTML = `
    <div class="row"><h1>Coberturas FX</h1><div class="spacer"></div></div>
    <p class="muted" style="margin-top:4px">Cobertura de tasa de cambio (COP/USD, EUR/USD) del ingreso/egreso de cada pedido. El resultado marcado a mercado llega con el feed de precios (fase siguiente).</p>
    <form id="fxf" class="row" style="margin:12px 0" onsubmit="return submitFx(event)">
      <select name="par"><option>USDCOP</option><option>EURUSD</option></select>
      <select name="tipo"><option>FORWARD</option><option>OPCION</option></select>
      <select name="lado"><option value="VENTA">Vendo divisa</option><option value="COMPRA">Compro divisa</option></select>
      <input name="nocional" type="number" step="any" required placeholder="nocional" style="width:120px">
      <input name="tasa" type="number" step="any" required placeholder="tasa" style="width:100px">
      <input name="fecha" type="date" required>
      <input name="vencimiento" type="date">
      <input name="pedido" placeholder="pedido" style="width:90px">
      <input name="notas" placeholder="notas" style="width:160px">
      <button class="btn-primary">+ FX</button>
    </form>
    <div class="tablewrap"><table>
      <thead><tr class="col"><th>Par</th><th>Tipo</th><th>Lado</th><th class="num">Nocional</th><th class="num">Tasa</th><th>Fecha</th><th>Vcto</th><th>Pedido</th><th>Notas</th><th></th></tr></thead>
      <tbody>${db.fx.length===0?`<tr><td colspan="10" class="muted" style="text-align:center;padding:16px">Sin coberturas FX.</td></tr>`:
        db.fx.map(x=>`<tr>
          <td><b>${x.par}</b></td><td>${x.tipo}</td><td>${x.lado==='VENTA'?'Vende':'Compra'}</td>
          <td class="num">${fmt(x.nocional)}</td><td class="num">${px(x.tasa)}</td>
          <td>${x.fecha||''}</td><td>${x.vencimiento||''}</td><td>${esc(x.pedido||'')}</td><td>${esc(x.notas||'')}</td>
          <td><span class="link" onclick="borrarFx('${x.id}')">borrar</span></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
}
function submitFx(e) {
  e.preventDefault(); const f=e.target; const db=loadDb();
  db.fx.push({ id:uid(), par:val(f,'par'), tipo:val(f,'tipo'), lado:val(f,'lado'),
    nocional:Number(val(f,'nocional')), tasa:Number(val(f,'tasa')), fecha:val(f,'fecha'),
    vencimiento:strOrNull(val(f,'vencimiento')), pedido:strOrNull(val(f,'pedido')), notas:strOrNull(val(f,'notas')) });
  saveDb(db); render(); return false;
}
function borrarFx(id){ if(!confirm('¿Borrar esta cobertura FX?'))return; const db=loadDb(); db.fx=db.fx.filter(x=>x.id!==id); saveDb(db); render(); }

/* ============ EXPORT CSV ============ */
function exportCsv() {
  const db = loadDb();
  const H = ['Cliente','Pedido','Compra_CodHP','Compra_Fecha','Compra_Sacos60','Compra_Lotes','Compra_Precio','Venta_CodHP','Venta_Fecha','Venta_Sacos60','Venta_Lotes','Venta_Precio','Posicion','Nemotecnico','FND','Estado','Resultado_USD'];
  const e = (v)=>{ const s=String(v??''); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const lines = [H.join(',')];
  for (const c of db.coberturas) {
    const res = resultadoDe(c);
    lines.push([c.cliente, c.pedido, c.compra?.codigoHP, c.compra?.fecha, c.compra?.sacos60,
      c.compra?legOk(c.compra)?sacos60ToLotes(c.compra.sacos60).toFixed(4):'':'', c.compra?.precio,
      c.venta?.codigoHP, c.venta?.fecha, c.venta?.sacos60,
      c.venta?legOk(c.venta)?sacos60ToLotes(c.venta.sacos60).toFixed(4):'':'', c.venta?.precio,
      c.posicion, nemo(c.posicion), c.fnd, coberturaEstado(c), res===null?'':res.toFixed(2)].map(e).join(','));
  }
  const blob = new Blob(['﻿'+lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'coberturas_equation_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}

window.addEventListener('hashchange', render);
render();
</script>
