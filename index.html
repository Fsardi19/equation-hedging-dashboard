<style>
  :root{
    --cream:#f7f7f1; --paper:#fffffe; --ink:#1c1b1b; --ink-2:#252524;
    --teal:#1a383f; --teal-2:#24505a; --teal-3:#0f272c;
    --tan:#cec1ad; --tan-2:#c9b9a1; --sand:#e9e3d6;

    --shadow:0 1px 2px rgba(28,27,27,.05),0 8px 24px -12px rgba(26,56,63,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-weight:400;-webkit-font-smoothing:antialiased;}
  .num,.tnum{font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  .sidebar{background:var(--teal);color:#e8ede9;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;flex-direction:column;gap:2px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.12);}
  .brand .mark{font-family:var(--serif);font-size:22px;letter-spacing:.14em;font-weight:700;color:#fff;}
  .brand .sub{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--tan);}
  .brand .tagline{font-family:var(--serif);font-style:italic;font-size:12px;color:#bcccc9;margin-top:8px;}
  nav.side{display:flex;flex-direction:column;gap:2px;margin-top:18px;}
  nav.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:14px;color:#c7d3d0;transition:.15s;cursor:pointer;}
  nav.side a svg{width:17px;height:17px;opacity:.8;flex:none;}
  nav.side a:hover{background:rgba(255,255,255,.07);color:#fff;}
  nav.side a.active{background:var(--tan);color:var(--teal-3);font-weight:700;}
  nav.side a.active svg{opacity:1;}
  .side-foot{margin-top:auto;font-size:11px;color:#8fa4a1;line-height:1.5;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);}
  .side-foot b{color:var(--tan);}
  .content{min-width:0;} main{padding:26px 32px 60px;max-width:1280px;}
  .phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .phead h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.1;margin:0;color:var(--ink-2);}
  .phead .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--tan-2);margin-bottom:5px;}
  .phead .desc{font-family:var(--serif);font-style:italic;color:var(--gray);font-size:14px;margin-top:3px;}
  .phead .actions{margin-left:auto;display:flex;gap:9px;}
  button,.btn{font-family:var(--sans);cursor:pointer;border:none;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;letter-spacing:.01em;transition:.15s;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 6px 16px -8px rgba(26,56,63,.7);}

  .btn-ghost{background:var(--paper);color:var(--teal);border:1px solid var(--line-2);}

  .btn-dark{background:var(--ink-2);color:#fff;} .btn-dark:hover{background:#000;}
  .btn-danger{background:#fff;color:var(--brick);border:1px solid #e7c3b4;} .btn-danger:hover{background:#fdf3ef;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;transition:.15s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-2);box-shadow:0 0 0 3px rgba(26,56,63,.1);}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray);font-weight:700;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .card.pad{padding:18px 20px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .5s both;}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tan);}
  .kpi.accent:before{background:var(--teal);} .kpi.warn:before{background:var(--amber);} .kpi.val:before{background:var(--tan-2);}
  .kpi .lbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);font-weight:700;}
  .kpi .big{font-family:var(--serif);font-size:27px;font-weight:700;margin-top:8px;line-height:1;color:var(--ink-2);}
  .kpi .foot{font-size:12px;color:var(--gray);margin-top:7px;}
  .pos-usd{color:var(--green);} .neg-usd{color:var(--brick);}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kpi:nth-child(2){animation-delay:.05s;}.kpi:nth-child(3){animation-delay:.1s;}.kpi:nth-child(4){animation-delay:.15s;}
  .charts{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:18px;}
  .card-h{display:flex;align-items:center;gap:8px;padding:15px 20px 0;}
  .card-h h3{font-family:var(--serif);font-size:16px;font-weight:700;margin:0;color:var(--ink-2);}
  .card-h .hint{font-size:11px;color:var(--gray);margin-left:auto;}
  .card-h select{font-size:12px;padding:5px 8px;margin-left:auto;}
  .chart-body{padding:12px 18px 18px;}
  .tablewrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--paper);}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr.grp th{background:var(--sand);color:var(--teal);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:9px 10px;text-align:center;}
  thead tr.col th{background:#faf8f3;color:var(--gray);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;}
  th.th-sort{cursor:pointer;user-select:none;} th.th-sort:hover{color:var(--teal);}
  th .arw{color:var(--teal);font-weight:900;}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink-2);}
  tbody tr{transition:.12s;cursor:pointer;} tbody tr:hover{background:#faf8f2;} tbody tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;} .sep{border-left:2px solid var(--line-2);}
  td.open,th.open{background:rgba(201,138,46,.12);}
  tfoot td{padding:12px 10px;background:#faf8f3;font-weight:700;color:var(--ink-2);border-top:1px solid var(--line-2);}
  .cli{font-weight:700;color:var(--ink-2);} .ped{color:var(--gray);font-size:12px;} .oic{font-size:11px;color:var(--teal-2);font-weight:700;}
  .pill{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;display:inline-block;}
  .pill.cerrada{background:rgba(47,107,79,.12);color:var(--green);} .pill.abierta{background:rgba(201,138,46,.16);color:#9a6a16;}
  .posbadge{font-family:var(--serif);font-weight:700;} .nemo{color:var(--tan-2);font-size:11px;font-weight:700;letter-spacing:.05em;}
  .rec{font-size:10px;padding:3px 8px;border-radius:7px;font-weight:800;letter-spacing:.02em;display:inline-block;white-space:nowrap;}
  .rec small{font-weight:700;opacity:.72;margin-left:4px;font-size:9px;}
  .rec-crit{background:rgba(180,82,46,.14);color:var(--brick);} .rec-take{background:rgba(47,107,79,.14);color:var(--green);}
  .rec-warn{background:rgba(201,138,46,.16);color:#9a6a16;} .rec-hold{background:#edefec;color:var(--gray);}
  .rec-none{background:transparent;color:var(--tan-2);}
  .metrics{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;}
  .metric span{color:var(--gray);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;font-weight:700;display:block;}
  .metric b{font-family:var(--serif);font-size:16px;color:var(--ink-2);font-weight:700;}
  .legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin-top:14px;align-items:center;}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:6px;}
  .link{color:var(--teal-2);border-bottom:1px solid var(--tan-2);cursor:pointer;font-weight:700;}
  .empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:44px;text-align:center;color:var(--gray);background:var(--paper);}
  .filters{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .filters .count{font-size:12px;color:var(--gray);}
  fieldset{border:1px solid var(--line-2);border-radius:12px;padding:16px;background:var(--paper);}
  fieldset legend{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--teal);padding:0 8px;}
  fieldset.open-leg{background:rgba(201,138,46,.07);border-color:#e6cfa2;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px;} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .bignum{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1;}
  .kv{font-size:13.5px;color:var(--ink-2);margin-top:5px;} .kv b{font-weight:700;}
  .backlink{color:var(--teal-2);font-weight:700;cursor:pointer;font-size:13px;}
  .cl-lbl{font:600 11px var(--sans);fill:var(--ink-2);} .cl-val{font:700 11px var(--sans);fill:var(--gray);}
  .donut-c{font-family:var(--serif);}
  @media (max-width:1000px){ .charts{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:760px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;padding:12px 16px;overflow-x:auto;}
    .brand{border:none;padding:0;flex:none;} .brand .tagline,.side-foot{display:none;}
    nav.side{flex-direction:row;margin:0;} main{padding:18px;}
    .grid2,.grid3,.detail-grid{grid-template-columns:1fr;}
  }
</style>

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">EQUATION</span><span class="sub">Coffee</span><span class="tagline">Cobertura con transparencia.</span></div>
    <nav class="side">
      <a data-v="libro" onclick="go('/libro')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>Dashboard</a>
      <a data-v="nueva" onclick="go('/nueva')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nueva cobertura</a>
      <a data-v="cierre" onclick="go('/cierre')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Cierre de mes</a>
      <a data-v="riesgo" onclick="go('/riesgo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 20h20L12 2z"/><path d="M12 9v5M12 17h.01"/></svg>Escenarios</a>

    </nav>
    <div class="side-foot"><b>MVP · v3</b><br>Datos en tu navegador.<br>Prototipo para pruebas.</div>

  <div class="content"><main id="app"></main></div>
</div>

<script>
/* ============ CONSTANTES / DOMINIO ============ */
const LB_PER_KG=2.2046226218, KC_CONTRACT_LB=37500, KG_SACO_COB=60;
const MESES=['Marzo','Mayo','Julio','Septiembre','Diciembre'];
const MES_IDX={Marzo:0,Mayo:1,Julio:2,Septiembre:3,Diciembre:4};
const NEMO={Marzo:'H',Mayo:'K',Julio:'N',Septiembre:'U',Diciembre:'Z'};
const ANIOS=[2025,2026,2027,2028];

const sacos60ToLb=s=>s*KG_SACO_COB*LB_PER_KG;
const sacos60ToLotes=s=>sacos60ToLb(s)/KC_CONTRACT_LB;
const legOk=l=>l&&l.precio!==null&&l.precio!==undefined&&l.precio!=='';
const coberturaEstado=c=>(legOk(c.compra)&&legOk(c.venta))?'CERRADA':'ABIERTA';
const posKey=c=>`${c.mes} ${c.anio}`;
const nemo=c=>NEMO[c.mes]?`KC${NEMO[c.mes]}${String(c.anio).slice(-1)}`:'';
function lotesDe(c){const lc=legOk(c.compra)?sacos60ToLotes(c.compra.sacos60):null;const lv=legOk(c.venta)?sacos60ToLotes(c.venta.sacos60):null;if(lc!==null&&lv!==null)return Math.min(lc,lv);return lc??lv??0;}
// Realizado: ambas patas cerradas
function resultadoRealizado(c){if(coberturaEstado(c)!=='CERRADA')return null;return (c.venta.precio-c.compra.precio)*lotesDe(c)*KC_CONTRACT_LB;}
// Valorado: pata abierta valorada contra el precio de cierre de la posicion (mark-to-market fin de mes)
function resultadoValorado(c,cierre){if(coberturaEstado(c)==='CERRADA'||cierre==null)return null;
  if(legOk(c.compra)&&!legOk(c.venta))return (cierre-c.compra.precio)*sacos60ToLotes(c.compra.sacos60)*KC_CONTRACT_LB;
  if(legOk(c.venta)&&!legOk(c.compra))return (c.venta.precio-cierre)*sacos60ToLotes(c.venta.sacos60)*KC_CONTRACT_LB;
  return null;}
function resultadoMostrado(c,db){const est=coberturaEstado(c);if(est==='CERRADA')return resultadoRealizado(c);return resultadoValorado(c,(db.cierres||{})[posKey(c)]);}

/* --- Motor de recomendacion (determinista, politica conservadora) --- */
const POL={sigmaDefault:0.35,z95:1.645,bufferFND:5,tpSigma:1.5,reviewSigma:-1};
const getSigma=(db,c)=>((db.sigmas||{})[posKey(c)] ?? POL.sigmaDefault);
function bizDays(from,to){if(!to)return null;const e=new Date(to);if(isNaN(e))return null;let d=new Date(from);d.setHours(0,0,0,0);e.setHours(0,0,0,0);let n=0,g=0;const s=e>=d?1:-1;while(d.getTime()!==e.getTime()&&g++<4000){d.setDate(d.getDate()+s);const w=d.getDay();if(w!==0&&w!==6)n+=s;}return n;}
function nemoSig(c){const order=['Marzo','Mayo','Julio','Septiembre','Diciembre'];const ni=((MES_IDX[c.mes]??0)+1)%5;const ny=ni===0?c.anio+1:c.anio;return `KC${NEMO[order[ni]]}${String(ny).slice(-1)}`;}
function recomendacion(c,db){
  const est=coberturaEstado(c);
  if(est==='CERRADA')return{accion:'—',tono:'rec-none',micro:'',detalle:'Resultado realizado; contabilizar.',m:null};
  const cierre=(db.cierres||{})[posKey(c)],sigma=getSigma(db,c);
  const tFND=c.fnd?bizDays(new Date(),c.fnd):null;
  const leg=legOk(c.compra)?c.compra:(legOk(c.venta)?c.venta:null);
  const lotesAb=leg?sacos60ToLotes(leg.sacos60):0, E_lb=lotesAb*KC_CONTRACT_LB;
  const Pmkt=cierre, plVal=resultadoValorado(c,cierre);
  const hDays=(tFND!=null&&tFND>0)?tFND:null;
  const sigma_h=hDays!=null?sigma*Math.sqrt(hDays/252):null;
  const banda1=(Pmkt!=null&&sigma_h!=null)?E_lb*Pmkt*sigma_h:null;
  const var95=banda1!=null?POL.z95*banda1:null;
  const nsig=(banda1&&plVal!=null&&banda1!==0)?plVal/banda1:null;
  const m={tFND,E_lb,lotesAb,sigma,sigma_h,banda1,var95,plVal,nsig};
  if(tFND!=null&&tFND<=POL.bufferFND)return{accion:'ROLAR / CERRAR',tono:'rec-crit',micro:`FND ${tFND}d`,detalle:`FND en ${tFND} días hábiles → rolar a ${nemoSig(c)} o cruzar la pata para evitar el aviso.`,m};
  if(nsig!=null){
    if(nsig>=POL.tpSigma&&plVal>0)return{accion:'CERRAR / CRUZAR',tono:'rec-take',micro:`+${nsig.toFixed(1)}σ`,detalle:`Movimiento +${nsig.toFixed(1)}σ a favor: capturar ${usd(plVal)} cruzando la pata.`,m};
    if(plVal<=-var95||nsig<=POL.reviewSigma)return{accion:'REVISAR / CUBRIR',tono:'rec-warn',micro:`${nsig.toFixed(1)}σ`,detalle:`Pérdida abierta ${usd(plVal)} ≈ ${nsig.toFixed(1)}σ · supera VaR95 ${usd(var95)}.`,m};
    return{accion:'MANTENER',tono:'rec-hold',micro:`${nsig>=0?'+':''}${nsig.toFixed(1)}σ`,detalle:`En banda (${nsig.toFixed(1)}σ) · VaR95 ${usd(var95)} · ${tFND!=null?tFND+'d a FND':'sin FND'}.`,m};
  }
  return{accion:'MANTENER',tono:'rec-hold',micro:tFND!=null?`${tFND}d`:'',detalle:`Define precio de cierre y σ de ${posKey(c)} para la señal de riesgo completa.`,m};
}
function recChip(r,fs){return `<span class="rec ${r.tono}"${fs?` style="font-size:12px"`:''}>${r.accion}${r.micro?`<small>${r.micro}</small>`:''}</span>`;}

/* ============ STORE ============ */
const KEY='eq_cob_v3', EMPTY={coberturas:[],fx:[],cierres:{},sigmas:{}};
function seed(){
  const cob=o=>Object.assign({id:uid(),incoterm:'FOB',proveedor:'',producto:'',loteOIC:'',cliente:'',pedido:'',mes:'Septiembre',anio:2026,fnd:'',compra:null,venta:null},o);
  const leg=(codigoHP,fecha,sacos60,precio)=>({codigoHP,fecha,sacos60,precio});
  return {coberturas:[
    cob({cliente:'Katz (Serengueti)',pedido:'S00443',loteOIC:'3-0659-00157',fnd:'2026-08-20',compra:leg('1506855','2026-07-22',70,3.181),venta:leg('1504300','2026-07-21',70,3.279)}),
    cob({cliente:'Katz (Serengueti)',pedido:'S00443',loteOIC:'3-0659-00157',fnd:'2026-08-20',compra:leg('1506862','2026-07-22',70,3.151),venta:leg('1513442','2026-07-27',70,3.281)}),
    cob({cliente:'Katz (Serengueti)',pedido:'S00443',loteOIC:'3-0659-00157',fnd:'2026-08-20',compra:leg('1519510','2026-07-29',140,3.247),venta:leg('1513638','2026-07-27',140,3.299)}),
    cob({cliente:'TAF',pedido:'S00329',loteOIC:'3-0659-00155',fnd:'2026-08-20',compra:leg('1519396','2026-07-29',140,3.2975),venta:leg('1516379','2026-07-28',140,3.459)}),
    cob({cliente:'TAF',pedido:'S00345',loteOIC:'3-0659-00118',fnd:'2026-08-20',compra:leg('1237914','2026-06-15',333,3.2835),venta:null}), // ABIERTA -> valorar al cierre Sep
    cob({cliente:'Royal Coffee Inc',pedido:'S00454',loteOIC:'3-0659-00161',mes:'Diciembre',fnd:'2026-11-20',compra:leg('1524797','2026-08-03',175,3.101),venta:null}),
  ],fx:[
    {id:uid(),par:'USDCOP',tipo:'FORWARD',lado:'VENTA',nocional:200000,tasa:4050,fecha:'2026-07-02',vencimiento:'2026-09-15',pedido:'S00443',notas:'Ingreso USD venta Katz'},
  ],cierres:{'Septiembre 2026':3.321,'Diciembre 2026':3.20},sigmas:{}};
}
function loadDb(){const raw=localStorage.getItem(KEY);if(!raw){const s=seed();localStorage.setItem(KEY,JSON.stringify(s));return s;}try{return{...structuredClone(EMPTY),...JSON.parse(raw)};}catch{return structuredClone(EMPTY);}}
function saveDb(db){localStorage.setItem(KEY,JSON.stringify(db));}
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2);

/* ============ HELPERS ============ */
const money=n=>Number(n).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>Number(n).toLocaleString('es-CO',{maximumFractionDigits:0});
const fmt=n=>Number(n).toLocaleString('es-CO',{maximumFractionDigits:0});

const px=n=>(n===null||n===undefined||n==='')?'':Number(n).toLocaleString('es-CO',{minimumFractionDigits:4,maximumFractionDigits:4});
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const trunc=(s,n)=>{s=String(s??'');return s.length>n?s.slice(0,n-1)+'…':s;};
const go=p=>{location.hash='#'+p;};
const val=(f,n)=>{const el=f.elements[n];return el?el.value:'';};
const numOrNull=v=>(v===''||v===null||v===undefined)?null:Number(v);

/* ============ SVG CHARTS ============ */
function hbars(data,{w=520,barH=24,gap=13,labelW=150}={}){
  if(!data.length)return `<div class="empty" style="padding:24px">Sin datos para graficar.</div>`;
  const max=Math.max(1,...data.map(d=>Math.abs(d.value))),chartW=w-labelW-70,pad=6,h=pad*2+data.length*(barH+gap)-gap;
  let y=pad,out='';
  for(const d of data){const len=Math.max(2,Math.abs(d.value)/max*chartW),color=d.value>=0?'var(--teal)':'var(--brick)';
    out+=`<text x="0" y="${y+barH*0.7}" class="cl-lbl">${esc(trunc(d.label,22))}</text>`;
    out+=`<rect x="${labelW}" y="${y}" width="${len}" height="${barH}" rx="5" fill="${color}"><animate attributeName="width" from="0" to="${len}" dur="0.7s" fill="freeze"/></rect>`;
    out+=`<text x="${labelW+len+8}" y="${y+barH*0.7}" class="cl-val">${money0(d.value)}</text>`;y+=barH+gap;}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${out}</svg>`;
}
function donut(segments,{size=180,thick=30,centerTop='',centerBot=''}={}){
  const total=segments.reduce((a,s)=>a+s.value,0),r=(size-thick)/2,cx=size/2,cy=size/2,C=2*Math.PI*r;let off=0,arcs='';
  if(total<=0)arcs=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${thick}"/>`;
  else for(const s of segments){const len=(s.value/total)*C;arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;}
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" class="donut-c" style="font-size:26px;font-weight:700;fill:var(--ink-2)">${centerTop}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" style="font:700 10px var(--sans);fill:var(--gray);letter-spacing:.1em">${centerBot}</text></svg>`;
}

/* ============ ROUTER ============ */
function render(){
  const app=document.getElementById('app');
  const hash=location.hash.replace(/^#/,'')||'/libro';
  const [_,view,id]=hash.split('/');
  document.querySelectorAll('nav.side a[data-v]').forEach(a=>a.classList.toggle('active',a.dataset.v===(view||'libro')));
  window.scrollTo(0,0);
  if(view==='nueva')return renderForm(app,null);
  if(view==='editar'&&id)return renderForm(app,id);
  if(view==='cobertura'&&id)return renderDetalle(app,id);
  if(view==='cierre')return renderCierre(app);
  if(view==='riesgo')return renderRiesgo(app);
  if(view==='fx')return renderFx(app);
  return renderLibro(app);
}

function sortRows(rows,db){
  const key=window.__sortKey||'posicion', dir=window.__sortDir||1;
  const acc={cliente:c=>c.cliente||'',pedido:c=>c.pedido||'',oic:c=>c.loteOIC||'',
    posicion:c=>c.anio*10+(MES_IDX[c.mes]??0),fnd:c=>c.fnd||'',
    resultado:c=>{const r=resultadoMostrado(c,db);return r==null?-1e15:r;}};
  const f=acc[key]||acc.posicion;
  return rows.slice().sort((a,b)=>{const va=f(a),vb=f(b);return (va<vb?-1:va>vb?1:0)*dir;});
}
function sortHead(key,label,cls=''){
  const active=(window.__sortKey||'posicion')===key, dir=window.__sortDir||1;
  return `<th class="th-sort ${cls}" onclick="setSort('${key}')">${label}${active?` <span class="arw">${dir>0?'▲':'▼'}</span>`:''}</th>`;
}
function setSort(key){if((window.__sortKey||'posicion')===key)window.__sortDir=-(window.__sortDir||1);else{window.__sortKey=key;window.__sortDir=1;}render();}

/* --- Cierre PARCIAL (fraccionar): cierra una fraccion y deja el resto abierto --- */
function submitParcial(e,id){
  e.preventDefault();const f=e.target,db=loadDb();
  const i=db.coberturas.findIndex(x=>x.id===id);if(i<0)return false;
  const c=db.coberturas[i];
  const openSide=legOk(c.compra)?'compra':'venta';      // pata existente
  const closeSide=openSide==='compra'?'venta':'compra';  // pata que se agrega
  const openLeg=c[openSide];
  const qty=Math.min(Number(val(f,'p_qty')),openLeg.sacos60);
  if(!(qty>0))return false;
  const closeLeg={codigoHP:strOrNull(val(f,'p_codigoHP')),fecha:strOrNull(val(f,'p_fecha')),sacos60:qty,precio:Number(val(f,'p_precio'))};
  const closed={...structuredClone(c),id:uid()};
  closed[openSide]={...openLeg,sacos60:qty};
  closed[closeSide]=closeLeg;
  db.coberturas.push(closed);
  const rem=openLeg.sacos60-qty;
  if(rem>0.0001)db.coberturas[i]={...c,[openSide]:{...openLeg,sacos60:rem}};
  else db.coberturas.splice(i,1);
  saveDb(db);go('/cobertura/'+closed.id);return false;
}

/* ============ RIESGO / ESCENARIOS DE VOLATILIDAD ============ */
function renderRiesgo(app){
  const db=loadDb();
  const abiertas=db.coberturas.filter(c=>coberturaEstado(c)==='ABIERTA');
  let totLb=0,totLotes=0,totNot=0;
  const pos=abiertas.map(c=>{const leg=legOk(c.compra)?c.compra:(legOk(c.venta)?c.venta:null);if(!leg)return null;
    const dir=legOk(c.compra)?1:-1; // compra abierta = long futuro
    const lotes=sacos60ToLotes(leg.sacos60),E=lotes*KC_CONTRACT_LB,Pref=(db.cierres||{})[posKey(c)]??leg.precio;
    totLb+=E;totLotes+=lotes;totNot+=E*Pref;return{dir,E,Pref};}).filter(Boolean);
  const SC=[-0.5,-0.25,-0.1,0.1,0.25,0.5];
  const scen=SC.map(s=>{const pnl=pos.reduce((a,p)=>a+p.dir*p.E*p.Pref*s,0);return{s,pnl,margin:pnl<0?-pnl:0};});
  const worst=scen.reduce((w,r)=>r.pnl<w.pnl?r:w,{pnl:Infinity,s:0});
  const margenLote=db.margenLote??null, initMargin=margenLote!=null?totLotes*margenLote:null;

  if(pos.length===0){app.innerHTML=header('Riesgo','Escenarios de volatilidad','Sensibilidad de la exposición abierta a movimientos del KC.','')+`<div class="empty">No hay posiciones abiertas: sin exposición direccional al KC ahora mismo.</div>`;return;}

  const kpis=`<div class="kpis">
    <div class="kpi accent"><div class="lbl">Exposición abierta</div><div class="big">${lot(totLotes)}</div><div class="foot">lotes · ${fmt(totLb)} lb</div></div>
    <div class="kpi"><div class="lbl">Nocional abierto</div><div class="big">${usd(totNot)}</div><div class="foot">${abiertas.length} posiciones</div></div>
    <div class="kpi warn"><div class="lbl">Peor caso ±50%</div><div class="big neg-usd">${usd(worst.pnl)}</div><div class="foot">llamado a margen ${usd(worst.margin)} → FCF</div></div>
    <div class="kpi val"><div class="lbl">Margen inicial</div><div class="big">${initMargin!=null?usd(initMargin):'—'}</div><div class="foot">${margenLote!=null?`$${money0(margenLote)}/lote`:'define $/lote abajo'}</div></div>
  </div>`;

  const chart=`<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>P&L de la exposición abierta por escenario</h3><span class="hint">movimiento del KC · USD</span></div>
    <div class="chart-body">${hbars(scen.map(r=>({label:(r.s>0?'+':'')+(r.s*100)+'%',value:r.pnl})),{labelW:70})}</div></div>`;

  const rows2=scen.map(r=>`<tr style="cursor:default">
    <td><b>${(r.s>0?'+':'')+(r.s*100)}%</b></td>
    <td class="num"><b class="${r.pnl>=0?'pos-usd':'neg-usd'}">${usd(r.pnl)}</b></td>
    <td class="num">${r.margin>0?`<span class="pill abierta">${usd(r.margin)}</span>`:'<span class="nemo">—</span>'}</td>
  </tr>`).join('');

  app.innerHTML=header('Riesgo','Escenarios de volatilidad','Sensibilidad de la exposición abierta del libro a movimientos del KC (±10 / 25 / 50%), para el análisis de flujo de caja.','')
    +kpis+chart
    +`<div class="card" style="padding:0;overflow:hidden;max-width:640px"><div class="tscroll"><table>
      <thead><tr class="col"><th>Escenario KC</th><th class="num">P&L exposición abierta</th><th class="num">Llamado a margen</th></tr></thead>
      <tbody>${rows2}</tbody>
    </table></div></div>
    <div class="card pad" style="margin-top:16px;max-width:640px">
      <div class="row" style="gap:10px"><span class="lbl" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-weight:700">Margen inicial por lote (Hedge Point, USD)</span>
        <input type="number" step="any" value="${margenLote??''}" placeholder="ej. 5000" style="width:120px;text-align:right" onchange="setMargenLote(this.value)"></div>
      <div class="muted" style="margin-top:8px">Con ${lot(totLotes)} lotes abiertos, el margen inicial inmovilizado sería ${initMargin!=null?usd(initMargin):'—'}. El <b>peor caso (±50%)</b> = ${usd(worst.margin)} es el llamado a margen a incorporar en el <b>FCF mensual proyectado</b>.</div>
    </div>
    <div class="legend"><span>Exposición firmada por dirección: compra abierta = largo futuro (pierde si baja el KC); venta abierta = corto (pierde si sube). Precio de referencia = cierre de la posición (o precio de la pata si no hay cierre).</span></div>`;
}

/* ============ FORM ============ */
function renderForm(app,id){
  const db=loadDb();const c=id?db.coberturas.find(x=>x.id===id):null;
  const clientes=[...new Set(db.coberturas.map(x=>x.cliente).filter(Boolean))].sort();
  const oics=[...new Set(db.coberturas.map(x=>x.loteOIC).filter(Boolean))].sort();
  const g=(path,d='')=>{if(!c)return d;const ps=path.split('.');let v=c;for(const p of ps)v=v?.[p];return(v===null||v===undefined)?d:v;};
  const openC=c&&!legOk(c.compra),openV=c&&!legOk(c.venta);
  app.innerHTML=header('Captura',id?'Editar cobertura':'Nueva cobertura','Registra las patas de compra y venta del futuro.','')
    +`<div class="backlink" onclick="go('/libro')">← Volver al libro</div>
    <form id="cf" onsubmit="return submitCobertura(event,${id?`'${id}'`:'null'})" style="margin-top:14px;max-width:880px">
      <fieldset><legend>Operación comercial</legend>
        <div class="grid3">
          <label class="field">Cliente<input name="cliente" required list="cli" value="${esc(g('cliente'))}" placeholder="Katz (Serengueti)"></label>
          <datalist id="cli">${clientes.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
          <label class="field">Pedido<input name="pedido" value="${esc(g('pedido'))}" placeholder="S00443"></label>
          <label class="field">Lote OIC<input name="loteOIC" list="oics" value="${esc(g('loteOIC'))}" placeholder="3-0659-00157"></label>
          <datalist id="oics">${oics.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
          <label class="field">Proveedor<input name="proveedor" value="${esc(g('proveedor'))}" placeholder="opcional"></label>
          <label class="field">Incoterm<input name="incoterm" value="${esc(g('incoterm','FOB'))}"></label>
          <label class="field">Producto<input name="producto" value="${esc(g('producto'))}" placeholder="opcional"></label>
          <label class="field">Posición · Mes<select name="mes">${MESES.map(m=>`<option ${m===g('mes','Septiembre')?'selected':''}>${m}</option>`).join('')}</select></label>
          <label class="field">Posición · Año<select name="anio">${ANIOS.map(a=>`<option ${a===g('anio',2026)?'selected':''}>${a}</option>`).join('')}</select></label>
          <label class="field">FND (First Notice Day)<input name="fnd" type="date" value="${esc(g('fnd'))}"></label>
        </div>
      </fieldset>
      <div class="grid2" style="margin-top:14px">
        <fieldset class="${openC?'open-leg':''}"><legend>Compra — long futuro</legend>
          <div style="display:flex;flex-direction:column;gap:11px">
            <label class="field">Código Hedge Point<input name="compra_codigoHP" value="${esc(g('compra.codigoHP'))}" placeholder="1506855"></label>
            <label class="field">Fecha<input name="compra_fecha" type="date" value="${esc(g('compra.fecha'))}"></label>
            <label class="field">Cantidad (sacos 60 kg)<input name="compra_sacos60" type="number" step="any" value="${esc(g('compra.sacos60'))}"></label>
            <label class="field">Precio (USD/lb)<input name="compra_precio" type="number" step="any" value="${esc(g('compra.precio'))}"></label>
          </div><div style="font-size:12px;color:var(--gray);margin-top:9px">Vacío = pata abierta (se valora al cierre).</div>
        </fieldset>
        <fieldset class="${openV?'open-leg':''}"><legend>Venta — short futuro</legend>
          <div style="display:flex;flex-direction:column;gap:11px">
            <label class="field">Código Hedge Point<input name="venta_codigoHP" value="${esc(g('venta.codigoHP'))}" placeholder="1504300"></label>
            <label class="field">Fecha<input name="venta_fecha" type="date" value="${esc(g('venta.fecha'))}"></label>
            <label class="field">Cantidad (sacos 60 kg)<input name="venta_sacos60" type="number" step="any" value="${esc(g('venta.sacos60'))}"></label>
            <label class="field">Precio (USD/lb)<input name="venta_precio" type="number" step="any" value="${esc(g('venta.precio'))}"></label>
          </div><div style="font-size:12px;color:var(--gray);margin-top:9px">Al completar ambas, el Resultado se calcula solo.</div>
        </fieldset>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn-primary">${id?'Guardar cambios':'Crear cobertura'}</button>
        <button type="button" class="btn-ghost" onclick="go('/libro')">Cancelar</button>
        ${id?`<button type="button" class="btn-danger" style="margin-left:auto" onclick="borrarCobertura('${id}')">🗑 Borrar</button>`:''}
      </div>
    </form>`;
}
function legFrom(f,pre){const codigoHP=strOrNull(val(f,pre+'_codigoHP')),fecha=strOrNull(val(f,pre+'_fecha')),sacos60=numOrNull(val(f,pre+'_sacos60')),precio=numOrNull(val(f,pre+'_precio'));if(codigoHP===null&&fecha===null&&sacos60===null&&precio===null)return null;return{codigoHP,fecha,sacos60,precio};}
function submitCobertura(e,id){e.preventDefault();const f=e.target,db=loadDb();
  const data={cliente:val(f,'cliente'),pedido:strOrNull(val(f,'pedido')),loteOIC:strOrNull(val(f,'loteOIC')),proveedor:strOrNull(val(f,'proveedor')),producto:strOrNull(val(f,'producto')),incoterm:val(f,'incoterm')||'FOB',mes:val(f,'mes'),anio:Number(val(f,'anio')),fnd:strOrNull(val(f,'fnd')),compra:legFrom(f,'compra'),venta:legFrom(f,'venta')};
  if(id){const i=db.coberturas.findIndex(x=>x.id===id);db.coberturas[i]={...db.coberturas[i],...data};}else{db.coberturas.push({id:uid(),...data});}
  saveDb(db);go('/libro');return false;}
function borrarCobertura(id){if(!confirm('¿Borrar esta cobertura?'))return;const db=loadDb();db.coberturas=db.coberturas.filter(x=>x.id!==id);saveDb(db);go('/libro');}

/* ============ DETALLE ============ */
function renderDetalle(app,id){
  const db=loadDb(),c=db.coberturas.find(x=>x.id===id);
  if(!c){app.innerHTML=`<div class="empty">No encontrada. <span class="link" onclick="go('/libro')">Volver</span></div>`;return;}
  const est=coberturaEstado(c),cierre=(db.cierres||{})[posKey(c)],rReal=resultadoRealizado(c),rVal=resultadoValorado(c,cierre),lotes=lotesDe(c);
  const rec=recomendacion(c,db);
  const recCard=est==='CERRADA'?'':`<div class="card pad" style="margin-top:14px;border-left:4px solid ${{'rec-crit':'var(--brick)','rec-take':'var(--green)','rec-warn':'var(--amber)','rec-hold':'var(--tan-2)'}[rec.tono]||'var(--tan-2)'}">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${recChip(rec,true)}<span style="font-size:14px;color:var(--ink-2)">${rec.detalle}</span></div>
    ${rec.m?`<div class="metrics">
      <div class="metric"><span>Días a FND</span><b>${rec.m.tFND??'—'}</b></div>
      <div class="metric"><span>Exposición</span><b>${lot(rec.m.lotesAb)} <span style="font-size:10px">lot</span></b></div>
      <div class="metric"><span>σ anual</span><b>${(rec.m.sigma*100).toFixed(0)}%</b></div>
      <div class="metric"><span>Banda 1σ</span><b>${rec.m.banda1!=null?usd(rec.m.banda1):'—'}</b></div>
      <div class="metric"><span>VaR 95%</span><b>${rec.m.var95!=null?usd(rec.m.var95):'—'}</b></div>
      <div class="metric"><span>P&L en σ</span><b>${rec.m.nsig!=null?(rec.m.nsig>=0?'+':'')+rec.m.nsig.toFixed(2)+'σ':'—'}</b></div>
    </div>`:''}
    <div class="legend" style="margin-top:8px"><span>Señal orientativa (VaR normal; el café tiene colas gordas). σ y precio de cierre se editan en <span class="link" onclick="go('/cierre')">Cierre de mes</span>.</span></div></div>`;
  const legCard=(title,leg,sub)=>{const open=!legOk(leg);return `<fieldset class="${open?'open-leg':''}"><legend>${title}${open?' · <span style="color:#9a6a16">ABIERTA</span>':''}</legend>
    <div style="font-size:12px;color:var(--gray);margin-bottom:8px">${sub}</div>
    ${leg?`<div class="kv">Código HP: <b>${esc(leg.codigoHP||'—')}</b></div><div class="kv">Fecha: <b>${leg.fecha||'—'}</b></div><div class="kv">Cantidad: <b>${leg.sacos60?fmt(leg.sacos60)+' sacos 60kg':'—'}</b> ${leg.sacos60?`<span class="nemo">(${lot(sacos60ToLotes(leg.sacos60))} lotes)</span>`:''}</div><div class="kv">Precio: <b>${leg.precio!=null?px(leg.precio)+' USD/lb':'—'}</b></div>`:`<div class="kv" style="color:var(--gray)">Falta cruzar esta pata — se valora al precio de cierre.</div>`}
    </fieldset>`;};
  const resBox=est==='CERRADA'
    ?`<div class="lbl" style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);font-weight:700">Resultado realizado</div><div class="bignum ${rReal>=0?'pos-usd':'neg-usd'}" style="margin-top:8px">${usd(rReal)}</div><div class="kv" style="margin-top:8px;color:var(--gray)">(venta ${px(c.venta.precio)} − compra ${px(c.compra.precio)}) × ${lot(lotes)} lotes × 37.500 lb</div>`
    :`<div class="lbl" style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);font-weight:700">Resultado valorado (al cierre)</div><div class="bignum ${rVal==null?'':(rVal>=0?'pos-usd':'neg-usd')}" style="margin-top:8px">${rVal==null?'—':usd(rVal)}</div><div class="kv" style="margin-top:8px;color:var(--gray)">${cierre==null?`Falta el precio de cierre de ${esc(posKey(c))}. <span class="link" onclick="go('/cierre')">Definir en Cierre de mes</span>`:`vs cierre ${px(cierre)} USD/lb · <span class="link" onclick="go('/cierre')">Cierre de mes</span>`}</div>`;
  app.innerHTML=header('Detalle',c.cliente||'—',c.pedido?'Pedido '+c.pedido:'Cobertura de futuros','')
    +`<div class="backlink" onclick="go('/libro')">← Volver al libro</div>
    <div class="detail-grid" style="margin-top:14px">
      <div class="card pad">
        <div class="lbl" style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);font-weight:700">Posición</div>
        <div style="font-family:var(--serif);font-size:30px;font-weight:700;margin-top:6px">${esc(c.mes)} ${c.anio} <span class="nemo" style="font-size:15px">${nemo(c)}</span></div>
        <div class="kv" style="margin-top:10px">Lote OIC: <b>${esc(c.loteOIC||'—')}</b> · FND: <b>${c.fnd||'—'}</b></div>
        <div class="kv">Incoterm: <b>${esc(c.incoterm||'')}</b> ${c.proveedor?'· Prov: '+esc(c.proveedor):''} ${c.producto?'· '+esc(c.producto):''}</div>
        <div style="margin-top:12px"><span class="pill ${est==='CERRADA'?'cerrada':'abierta'}">${est}</span></div>
      </div>
      <div class="card pad" style="border-color:${(est==='CERRADA'?rReal:rVal)==null?'var(--line)':((est==='CERRADA'?rReal:rVal)>=0?'#bcd8c9':'#e7c3b4')}">${resBox}</div>
    </div>
    ${recCard}
    <div class="grid2" style="margin-top:14px">
      ${legCard('Compra — long futuro',c.compra,'Cuando vendemos al cliente, compramos el futuro.')}
      ${legCard('Venta — short futuro',c.venta,'Cuando compramos el café, vendemos el futuro y cerramos.')}
    </div>
    ${est==='ABIERTA'?`<fieldset style="margin-top:14px"><legend>Cerrar parcial · fraccionar</legend>
      <div style="font-size:12px;color:var(--gray);margin-bottom:9px">Cierra solo una fracción con la pata de <b>${legOk(c.compra)?'venta':'compra'}</b>; el resto (${fmt((legOk(c.compra)?c.compra:c.venta).sacos60)} sacos) queda como cobertura abierta. Útil cuando no se compra todo el pergamino del pedido de una vez.</div>
      <form onsubmit="return submitParcial(event,'${c.id}')" class="row" style="gap:9px">
        <input name="p_codigoHP" placeholder="Cód. HP (${legOk(c.compra)?'venta':'compra'})" style="width:150px">
        <input name="p_fecha" type="date">
        <input name="p_qty" type="number" step="any" required placeholder="sacos 60 a cerrar" value="${(legOk(c.compra)?c.compra:c.venta).sacos60}" style="width:150px">
        <input name="p_precio" type="number" step="any" required placeholder="precio USD/lb" style="width:140px">
        <button class="btn-dark">Cerrar fracción</button>
      </form></fieldset>`:''}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-dark" onclick="go('/editar/${c.id}')">✎ Editar / completar pata</button>
      <button class="btn-danger" onclick="borrarCobertura('${c.id}')">🗑 Borrar</button>
    </div>`;
}

/* ============ FX ============ */
function renderFx(app){
  const db=loadDb();
  app.innerHTML=header('Divisas','Coberturas FX','Cobertura de tasa de cambio (COP/USD, EUR/USD) del flujo de cada pedido.','')
    +`<form id="fxf" class="filters" style="gap:9px" onsubmit="return submitFx(event)">
      <select name="par"><option>USDCOP</option><option>EURUSD</option></select>
      <select name="tipo"><option>FORWARD</option><option>OPCION</option></select>
      <select name="lado"><option value="VENTA">Vendo divisa</option><option value="COMPRA">Compro divisa</option></select>
      <input name="nocional" type="number" step="any" required placeholder="nocional" style="width:120px">
      <input name="tasa" type="number" step="any" required placeholder="tasa" style="width:100px">
      <input name="fecha" type="date" required><input name="vencimiento" type="date">
      <input name="pedido" placeholder="pedido" style="width:90px"><input name="loteOIC" placeholder="lote OIC" style="width:120px">
      <input name="notas" placeholder="notas" style="width:150px"><button class="btn-primary btn-sm">+ Agregar FX</button>
    </form>
    <div class="tablewrap"><div class="tscroll"><table>
      <thead><tr class="col"><th>Par</th><th>Tipo</th><th>Lado</th><th class="num">Nocional</th><th class="num">Tasa</th><th>Fecha</th><th>Vcto</th><th>Pedido</th><th>Lote OIC</th><th>Notas</th><th></th></tr></thead>
      <tbody>${db.fx.length===0?`<tr><td colspan="11" style="text-align:center;padding:26px;color:var(--gray)">Sin coberturas FX. Agrega la primera arriba.</td></tr>`:
        db.fx.map(x=>`<tr style="cursor:default"><td><b>${x.par}</b></td><td>${x.tipo}</td><td>${x.lado==='VENTA'?'Vende':'Compra'}</td><td class="num">${fmt(x.nocional)}</td><td class="num">${px(x.tasa)}</td><td>${x.fecha||''}</td><td>${x.vencimiento||''}</td><td>${esc(x.pedido||'')}</td><td class="oic">${esc(x.loteOIC||'')}</td><td>${esc(x.notas||'')}</td><td><span class="link" onclick="borrarFx('${x.id}')">borrar</span></td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="legend"><span>El resultado marcado a mercado (mark-to-market) llega con el feed de precios en la siguiente fase.</span></div>`;
}
function submitFx(e){e.preventDefault();const f=e.target,db=loadDb();db.fx.push({id:uid(),par:val(f,'par'),tipo:val(f,'tipo'),lado:val(f,'lado'),nocional:Number(val(f,'nocional')),tasa:Number(val(f,'tasa')),fecha:val(f,'fecha'),vencimiento:strOrNull(val(f,'vencimiento')),pedido:strOrNull(val(f,'pedido')),loteOIC:strOrNull(val(f,'loteOIC')),notas:strOrNull(val(f,'notas'))});saveDb(db);render();return false;}
function borrarFx(id){if(!confirm('¿Borrar esta cobertura FX?'))return;const db=loadDb();db.fx=db.fx.filter(x=>x.id!==id);saveDb(db);render();}

/* ============ EXPORT CSV ============ */
function exportCsv(){
  const db=loadDb();
  const H=['Incoterm','Cliente','Pedido','Lote OIC','Proveedor','Compra_CodHP','Compra_Fecha','Compra_Sacos60','Compra_Lotes','Compra_Precio','Venta_CodHP','Venta_Fecha','Venta_Sacos60','Venta_Lotes','Venta_Precio','Mes','Anio','Nemotecnico','FND','Estado','Cierre_posicion','Resultado_realizado_USD','Resultado_valorado_USD','Accion_sugerida','VaR95_USD','PL_en_sigma'];
  const e=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
  const L=[H.join(',')];
  for(const c of db.coberturas){const cierre=(db.cierres||{})[posKey(c)],rr=resultadoRealizado(c),rv=resultadoValorado(c,cierre),rec=recomendacion(c,db);
    L.push([c.incoterm,c.cliente,c.pedido,c.loteOIC,c.proveedor,c.compra?.codigoHP,c.compra?.fecha,c.compra?.sacos60,c.compra&&legOk(c.compra)?sacos60ToLotes(c.compra.sacos60).toFixed(4):'',c.compra?.precio,c.venta?.codigoHP,c.venta?.fecha,c.venta?.sacos60,c.venta&&legOk(c.venta)?sacos60ToLotes(c.venta.sacos60).toFixed(4):'',c.venta?.precio,c.mes,c.anio,nemo(c),c.fnd,coberturaEstado(c),cierre??'',rr==null?'':rr.toFixed(2),rv==null?'':rv.toFixed(2),rec.accion,rec.m&&rec.m.var95!=null?rec.m.var95.toFixed(2):'',rec.m&&rec.m.nsig!=null?rec.m.nsig.toFixed(2):''].map(e).join(','));}
  const blob=new Blob(['﻿'+L.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='coberturas_equation_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

window.addEventListener('hashchange',render);
render();
</script>
